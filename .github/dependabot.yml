version: 2

multi-ecosystem-groups:
  weekly-dependencies:
    schedule:
      interval: weekly
    open-pull-requests-limit: 1

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
  - package-ecosystem: npm
    directory: /
    # React Three Fiber 9.7 requires React versions below 19.3.
    ignore:
      - dependency-name: react
        versions: [">=19.3"]
      - dependency-name: react-dom
        versions: [">=19.3"]
    schedule:
      interval: weekly
    patterns: ["*"]
    multi-ecosystem-group: weekly-dependencies
